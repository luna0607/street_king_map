name: Data contribution
description: Submit new location pins or new videos for the map
title: "[Contribution] "
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        Paste the `contributions.json` you exported from the admin page below.
        After you submit, a bot takes **~1–2 minutes** to validate the JSON, open a
        pull request that closes this issue, and record you as the contributor.
        You'll get a comment here with the PR link when it's ready.
        (Watch progress on the [Actions tab](../../actions).)
  - type: textarea
    id: json
    attributes:
      label: Contributions JSON
      description: The full body of your `contributions.json` file.
      render: json
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note to the maintainer (optional)
      description: Anything to add
    validations:
      required: false
